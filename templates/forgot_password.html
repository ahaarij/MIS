<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.10);width:100%;max-width:400px;padding:40px 36px}
.brand{text-align:center;margin-bottom:32px}
.brand-icon{width:52px;height:52px;background:#1e3a8a;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;font-weight:800;color:#fff}
.brand h1{font-size:1.35rem;font-weight:700;color:#0f172a}
.brand p{font-size:.8rem;color:#64748b;margin-top:3px}
.form-group{margin-bottom:18px}
label{display:block;font-size:.76rem;font-weight:600;color:#374151;margin-bottom:6px}
input{width:100%;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.88rem;font-family:inherit;color:#0f172a;outline:none;transition:border-color .15s}
input:focus{border-color:#1e3a8a}
.btn{width:100%;padding:11px;background:#1e3a8a;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s;margin-top:4px}
.btn:hover{background:#1e40af}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:7px;padding:9px 12px;font-size:.78rem;margin-bottom:16px;display:none}
.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:7px;padding:9px 12px;font-size:.78rem;margin-bottom:16px;display:none}
.reset-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:9px;padding:14px;margin-top:20px;display:none}
.reset-box p{font-size:.78rem;color:#0369a1;font-weight:600;margin-bottom:8px}
.reset-link{font-size:.73rem;word-break:break-all;color:#0f172a;background:#e0f2fe;padding:8px 10px;border-radius:6px;display:block;margin-bottom:8px}
.copy-btn{width:100%;padding:8px;background:#0369a1;color:#fff;border:none;border-radius:6px;font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer}
.copy-btn:hover{background:#0284c7}
.links{text-align:center;margin-top:20px;font-size:.78rem;color:#64748b}
.links a{color:#1e3a8a;font-weight:600;text-decoration:none}
@media(max-width:440px){.card{padding:28px 20px;border-radius:10px}.brand h1{font-size:1.15rem}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">MIS</div>
    <h1>Reset password</h1>
    <p>Enter your email to receive a reset link</p>
  </div>
  <div class="error" id="err"></div>
  <div class="success" id="ok"></div>
  <div id="form-area">
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@company.com">
    </div>
    <button class="btn" id="btn" onclick="doForgot()">Send Reset Link</button>
  </div>
  <div class="reset-box" id="reset-box">
    <p>Email not configured — share this link manually with the user:</p>
    <span class="reset-link" id="reset-url"></span>
    <button class="copy-btn" onclick="copyLink()">Copy Link</button>
  </div>
  <div class="links"><a href="/login">← Back to sign in</a></div>
</div>
<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') doForgot(); });
async function doForgot() {
  const email = document.getElementById('email').value.trim();
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  const btn = document.getElementById('btn');
  err.style.display = ok.style.display = 'none';
  if (!email) { err.textContent = 'Please enter an email address.'; err.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch('/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'Something went wrong.'; err.style.display='block';
    } else if (data.sent) {
      document.getElementById('form-area').style.display = 'none';
      ok.textContent = 'Reset link sent! Check your inbox (and spam folder).';
      ok.style.display = 'block';
    } else if (data.reset_url) {
      document.getElementById('reset-url').textContent = data.reset_url;
      document.getElementById('reset-box').style.display = 'block';
      ok.textContent = 'Link generated. SMTP is not configured — share the link below manually.';
      ok.style.display = 'block';
      document.getElementById('form-area').style.display = 'none';
    } else {
      document.getElementById('form-area').style.display = 'none';
      ok.textContent = 'If that email is registered, a reset link has been sent.';
      ok.style.display = 'block';
    }
  } catch(e) { err.textContent = 'Network error.'; err.style.display='block'; }
  btn.disabled = false; btn.textContent = 'Send Reset Link';
}
function copyLink() {
  const url = document.getElementById('reset-url').textContent;
  navigator.clipboard.writeText(url).then(() => {
    document.querySelector('.copy-btn').textContent = 'Copied!';
    setTimeout(() => document.querySelector('.copy-btn').textContent = 'Copy Link', 2000);
  });
}
</script>
</body>
</html>
