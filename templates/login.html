<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.10);width:100%;max-width:400px;padding:40px 36px}
.brand{text-align:center;margin-bottom:32px}
.brand-icon{width:52px;height:52px;background:#1e3a8a;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px}
.brand h1{font-size:1.35rem;font-weight:700;color:#0f172a}
.brand p{font-size:.8rem;color:#64748b;margin-top:3px}
.form-group{margin-bottom:18px}
label{display:block;font-size:.76rem;font-weight:600;color:#374151;margin-bottom:6px}
input{width:100%;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.88rem;font-family:inherit;color:#0f172a;outline:none;transition:border-color .15s}
input:focus{border-color:#1e3a8a}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:2px;color:#94a3b8;display:flex;align-items:center}
.pw-eye:hover{color:#475569}
.btn{width:100%;padding:11px;background:#1e3a8a;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s;margin-top:4px}
.btn:hover{background:#1e40af}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:7px;padding:9px 12px;font-size:.78rem;margin-bottom:16px;display:none}
.links{text-align:center;margin-top:20px;font-size:.78rem;color:#64748b}
.links a{color:#1e3a8a;font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
@media(max-width:440px){.card{padding:28px 20px;border-radius:10px}.brand h1{font-size:1.15rem}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">MIS</div>
    <h1>Welcome back</h1>
    <p>Sign in to your account</p>
  </div>
  <div class="error" id="err"></div>
  <div class="form-group">
    <label>Email address</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="pw-eye" type="button" onclick="togglePw('password',this)" tabindex="-1">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <button class="btn" id="btn" onclick="doLogin()">Sign In</button>
  <div class="links">
    <a href="/forgot-password">Forgot password?</a>
    &nbsp;·&nbsp;
    <a href="/register">Create account</a>
  </div>
</div>
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  if (!email || !password) { err.textContent = 'Please enter your email and password.'; err.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
    const data = await res.json();
    if (data.ok) { window.location.href = '/'; }
    else { err.textContent = data.error || 'Login failed.'; err.style.display='block'; }
  } catch(e) { err.textContent = 'Network error. Please try again.'; err.style.display='block'; }
  btn.disabled = false; btn.textContent = 'Sign In';
}
</script>
</body>
</html>
